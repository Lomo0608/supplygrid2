<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: #0a1628; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
    .nav-logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; cursor: pointer; }
    .nav-logo em { font-style: normal; color: #3b82f6; }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .card-title { font-size: 18px; font-weight: 500; color: #111; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #7ba3c8; margin-bottom: 24px; }
    .tabs { display: flex; gap: 0; margin-bottom: 22px; border: 0.5px solid #e8e8e8; border-radius: 6px; overflow: hidden; }
    .tab { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; color: #7ba3c8; cursor: pointer; background: transparent; border: none; font-family: inherit; transition: all 0.15s; }
    .tab.active { background: #0a1628; color: #fff; font-weight: 500; }
    .type-label { font-size: 11px; color: #7ba3c8; text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
    .account-type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .type-btn { padding: 10px; border: 0.5px solid #e8e8e8; border-radius: 6px; background: transparent; color: #7ba3c8; font-size: 12px; cursor: pointer; font-family: inherit; text-align: center; transition: all 0.15s; }
    .type-btn.selected { border-color: #3b82f6; color: #111; background: #eff6ff; font-weight: 500; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: #7ba3c8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    .field input, .field select { width: 100%; background: #fff; border: 0.5px solid #e0e0e0; border-radius: 6px; padding: 10px 12px; color: #111; font-size: 13px; font-family: inherit; transition: border-color 0.15s; }
    .field input:focus, .field select:focus { outline: none; border-color: #3b82f6; }
    .field input::placeholder { color: #bbb; }
    .submit-btn { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 11px 0; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 6px; transition: background 0.15s; }
    .submit-btn:hover { background: #2563eb; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-top: 12px; display: none; }
    .status.success { display: block; background: #f0fdf4; color: #166534; border: 0.5px solid #bbf7d0; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; border: 0.5px solid #fecaca; }
    .status.loading { display: block; background: #fafafa; color: #7ba3c8; border: 0.5px solid #e8e8e8; }
    .forgot { text-align: center; margin-top: 12px; }
    .forgot span { font-size: 12px; color: #aaa; cursor: pointer; }
    .forgot span:hover { color: #111; }
    .back-link { font-size: 12px; color: #aaa; text-align: center; margin-top: 16px; cursor: pointer; }
    .back-link:hover { color: #111; }
    footer { background: #0a1628; padding: 18px 40px; text-align: center; }
    footer span { font-size: 12px; color: #555; }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">SUPPLY<em>GRID</em></div>
</nav>

<div class="page">
  <div class="card">
    <div class="card-title">Welcome to SupplyGrid</div>
    <div class="card-sub">Search inventory, list parts, or sell excess anonymously.</div>
    <div class="tabs">
      <button class="tab active" id="tabSignup" onclick="switchTab('signup')">Create account</button>
      <button class="tab" id="tabLogin" onclick="switchTab('login')">Sign in</button>
    </div>

    <div id="signupForm">
      <div class="type-label">I am a</div>
      <div class="account-type" style="grid-template-columns:1fr 1fr 1fr">
        <button class="type-btn selected" id="typeBuyer" onclick="selectType('buyer')">🔍 Buyer</button>
        <button class="type-btn" id="typeSupplier" onclick="selectType('supplier')">📦 Supplier / Broker</button>
        <button class="type-btn" id="typeOEM" onclick="selectType('oem')">🏭 OEM</button>
      </div>
      <div class="field"><label>Email</label><input type="email" id="signupEmail" placeholder="you@company.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="signupPassword" placeholder="Min 8 characters" /></div>
      <div class="field" id="companyField"><label>Company name</label><input type="text" id="signupCompany" placeholder="Your company" /></div>
      <div class="field" id="regionField" style="display:none">
        <label>Region</label>
        <select id="signupRegion"><option value="Americas">Americas</option><option value="Europe">Europe</option><option value="Asia">Asia</option></select>
      </div>
      <button class="submit-btn" onclick="doSignup()">Create free account →</button>
      <div class="status" id="signupStatus"></div>
    </div>

    <div id="loginForm" style="display:none">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@company.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="Your password" onkeydown="if(event.key==='Enter') doLogin()" /></div>
      <button class="submit-btn" onclick="doLogin()">Sign in →</button>
      <div class="forgot"><span onclick="showForgot()">Forgot password?</span></div>
      <div class="status" id="loginStatus"></div>
    </div>

    <div id="forgotForm" style="display:none">
      <div class="field"><label>Email address</label><input type="email" id="forgotEmail" placeholder="you@company.com" /></div>
      <button class="submit-btn" onclick="doForgot()">Send reset link →</button>
      <div class="forgot"><span onclick="hideForgot()">← Back to sign in</span></div>
      <div class="status" id="forgotStatus"></div>
    </div>

    <div class="back-link" onclick="window.location.href='index.html'">← Back to search</div>
  </div>
</div>

<footer><span>SUPPLY<strong style="color:#3b82f6">GRID</strong> · Real inventory · No commission fees</span></footer>

<script>
  const { createClient } = supabase
  const SUPABASE_URL = 'https://zcqfwkbgrevaixqjytzc.supabase.co'
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds'
  const client = createClient(SUPABASE_URL, ANON_KEY)
  let accountType = 'buyer'

  function switchTab(tab) {
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none'
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none'
    document.getElementById('forgotForm').style.display = 'none'
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup')
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login')
  }

  function selectType(type) {
    accountType = type
    document.getElementById('typeBuyer').classList.toggle('selected', type === 'buyer')
    document.getElementById('typeSupplier').classList.toggle('selected', type === 'supplier')
    document.getElementById('typeOEM').classList.toggle('selected', type === 'oem')
    document.getElementById('regionField').style.display = (type === 'supplier' || type === 'oem') ? 'block' : 'none'
    if (type === 'oem') {
      document.getElementById('companyField').querySelector('label').textContent = 'Company name (kept confidential)'
    } else {
      document.getElementById('companyField').querySelector('label').textContent = 'Company name'
    }
  }

  async function doSignup() {
    const email = document.getElementById('signupEmail').value.trim()
    const password = document.getElementById('signupPassword').value
    const company = document.getElementById('signupCompany').value.trim()
    const region = document.getElementById('signupRegion').value
    const status = document.getElementById('signupStatus')
    if (!email || !password) { status.className = 'status error'; status.textContent = 'Email and password are required.'; return }
    status.className = 'status loading'; status.textContent = 'Creating account...'
    const { data, error } = await client.auth.signUp({ email, password, options: { data: { company_name: company, account_type: accountType, region } } })
    if (error) { status.className = 'status error'; status.textContent = error.message; return }

    // Always create a suppliers row — everyone who might list inventory needs one
    // The account_type field controls behavior, not whether the row exists
    await client.from('suppliers').upsert({
      id: data.user.id,
      company_name: company || null,
      email,
      region: region || null,
      membership_tier: 'free',
      verification_tier: 0,
      account_type: accountType,
      anonymous_seller: false,
      suspended: false
    })

    status.className = 'status success'
    status.textContent = accountType === 'oem'
      ? 'OEM account created. You can list inventory anonymously. Check your email to confirm then sign in.'
      : accountType === 'buyer'
      ? 'Account created. Check your email to confirm then sign in.'
      : 'Supplier account created. Check your email to confirm then sign in.'
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim()
    const password = document.getElementById('loginPassword').value
    const status = document.getElementById('loginStatus')
    if (!email || !password) { status.className = 'status error'; status.textContent = 'Email and password are required.'; return }
    status.className = 'status loading'; status.textContent = 'Signing in...'
    const { error } = await client.auth.signInWithPassword({ email, password })
    if (error) { status.className = 'status error'; status.textContent = error.message; return }
    window.location.href = 'dashboard.html'
  }

  function showForgot() {
    document.getElementById('loginForm').style.display = 'none'
    document.getElementById('forgotForm').style.display = 'block'
  }

  function hideForgot() {
    document.getElementById('forgotForm').style.display = 'none'
    document.getElementById('loginForm').style.display = 'block'
  }

  async function doForgot() {
    const email = document.getElementById('forgotEmail').value.trim()
    const status = document.getElementById('forgotStatus')
    if (!email) { status.className = 'status error'; status.textContent = 'Please enter your email.'; return }
    status.className = 'status loading'; status.textContent = 'Sending reset link...'
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: 'https://supplygrid2.vercel.app/resetpassword.html' })
    if (error) { status.className = 'status error'; status.textContent = error.message; return }
    status.className = 'status success'; status.textContent = 'Reset link sent. Check your email.'
  }
</script>
</body>
</html>
