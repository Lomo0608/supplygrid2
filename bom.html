<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — BOM Sourcing</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0a1628; --navy-2: #0d1e38; --blue: #3b82f6; --blue-hover: #2563eb; --blue-light: #60a5fa; --text-muted: #7ba3c8; --text-faint: #4a7aa8; --border-dark: #1a3560; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: #f5f7fa; color: var(--navy); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    nav { background: rgba(10,22,40,0.9); backdrop-filter: blur(12px); height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid var(--border-dark); }
    .nav-logo { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 0.5px; cursor: pointer; }
    .nav-logo em { font-style: normal; color: var(--blue); }
    .nav-btn { font-size: 13px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-dark); background: transparent; color: #e2e8f0; cursor: pointer; font-family: inherit; font-weight: 500; }
    .nav-btn:hover { border-color: var(--blue); color: #fff; }

    .hero { background: var(--navy); padding: 40px 40px 36px; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -160px; left: 30%; width: 600px; height: 380px; background: radial-gradient(ellipse at center, rgba(59,130,246,0.15) 0%, transparent 70%); }
    .hero-inner { position: relative; z-index: 2; max-width: 920px; margin: 0 auto; }
    .ai-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--blue-light); background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); padding: 5px 12px; border-radius: 100px; margin-bottom: 16px; font-weight: 600; }
    .hero h1 { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.7px; margin-bottom: 10px; }
    .hero p { font-size: 15px; color: var(--text-muted); line-height: 1.5; max-width: 580px; }

    .main { max-width: 920px; margin: 0 auto; padding: 28px 40px 80px; }
    .step { background: #fff; border: 1px solid #e6ebf2; border-radius: 16px; padding: 28px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(10,22,40,0.04); }
    .step-num { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .step-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 6px; letter-spacing: -0.3px; }
    .step-sub { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 18px; }

    .drop-zone { border: 2px dashed #cbd9e8; border-radius: 14px; padding: 48px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafcfe; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--blue); background: #f0f7ff; }
    .drop-icon { font-size: 36px; margin-bottom: 14px; }
    .drop-title { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    .drop-sub { font-size: 13px; color: #64748b; margin-bottom: 18px; }
    .drop-btn { background: var(--blue); color: #fff; border: none; border-radius: 9px; padding: 11px 26px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .drop-btn:hover { background: var(--blue-hover); }
    .file-name { font-size: 13px; color: var(--navy); margin-top: 14px; font-weight: 500; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-size: 10px; color: #64748b; font-weight: 600; text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 1px solid #eef2f7; text-transform: uppercase; letter-spacing: 0.3px; }
    td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; color: var(--navy); }
    .confirm-table input { width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 7px 9px; font-size: 12px; font-family: 'SF Mono', Menlo, monospace; color: var(--navy); }
    .confirm-table input:focus { outline: none; border-color: var(--blue); }
    .row-remove { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 16px; }
    .row-remove:hover { color: #dc2626; }
    .table-wrap { border: 1px solid #e6ebf2; border-radius: 12px; overflow: hidden; max-height: 420px; overflow-y: auto; }

    .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .filter-field label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
    .filter-field select { width: 100%; background: #fff; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px 13px; color: var(--navy); font-size: 14px; font-family: inherit; }
    .toggle-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
    .toggle { width: 44px; height: 24px; border-radius: 12px; background: #e0e0e0; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
    .toggle.on { background: #22c55e; }
    .toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .toggle.on .toggle-knob { left: 22px; }
    .toggle-label { font-size: 14px; color: var(--navy); }
    .toggle-sub { font-size: 12px; color: #94a3b8; }

    .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 13px 28px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .btn-primary:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ghost { background: #fff; color: var(--navy); border: 1px solid #d8e0ea; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-ghost:hover { border-color: var(--blue); color: var(--blue); }

    .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .summary-card { border-radius: 12px; padding: 18px 20px; text-align: center; }
    .summary-card.total { background: #f8fafc; border: 1px solid #e6ebf2; }
    .summary-card.covered { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .summary-card.gaps { background: #fff7ed; border: 1px solid #fed7aa; }
    .summary-num { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 2px; }
    .summary-card.total .summary-num { color: var(--navy); }
    .summary-card.covered .summary-num { color: #166534; }
    .summary-card.gaps .summary-num { color: #9a3412; }
    .summary-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; color: #64748b; }

    .coverage-line { border: 1px solid #e6ebf2; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
    .coverage-line.gap { background: #fffbf7; border-color: #fed7aa; }
    .coverage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .coverage-pn { font-family: 'SF Mono', Menlo, monospace; font-size: 14px; font-weight: 700; color: var(--navy); }
    .coverage-qty { font-size: 12px; color: #64748b; }
    .coverage-status { font-size: 11px; padding: 3px 10px; border-radius: 100px; font-weight: 600; }
    .coverage-status.ok { background: #f0fdf4; color: #166534; }
    .coverage-status.no { background: #fff7ed; color: #9a3412; }
    .match-option { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid #eef2f7; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .match-option:hover { border-color: var(--blue); }
    .match-option input { accent-color: var(--blue); }
    .match-supplier { font-size: 13px; font-weight: 600; color: var(--navy); }
    .match-meta { font-size: 11px; color: #64748b; }
    .match-badge { font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
    .match-badge.v { background: #eff6ff; color: #1d4ed8; }
    .match-badge.c { background: #f0fdf4; color: #166534; }
    .gap-note { font-size: 12px; color: #9a3412; }

    .loading { text-align: center; padding: 50px; color: #94a3b8; font-size: 14px; }
    .gate-card { background: var(--navy); border-radius: 16px; padding: 44px; text-align: center; position: relative; overflow: hidden; }
    .gate-card::before { content: ''; position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 500px; height: 300px; background: radial-gradient(ellipse at center, rgba(59,130,246,0.2) 0%, transparent 70%); }
    .gate-inner { position: relative; z-index: 2; }
    .gate-card h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -0.5px; }
    .gate-card p { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; max-width: 460px; margin: 0 auto 28px; }
    .gate-features { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto 28px; text-align: left; }
    .gate-feature { font-size: 14px; color: #e2e8f0; display: flex; align-items: center; gap: 10px; }
    .gate-feature span { color: var(--blue-light); }
    .gate-btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 13px 32px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .status-msg { font-size: 13px; padding: 11px 14px; border-radius: 8px; margin-top: 14px; display: none; }
    .status-msg.error { display: block; background: #fef2f2; color: #991b1b; }
    .status-msg.success { display: block; background: #f0fdf4; color: #166534; }

    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .hero { padding: 28px 16px; }
      .hero h1 { font-size: 24px; }
      .main { padding: 20px 16px 60px; }
      .step { padding: 20px; }
      .filters-grid, .summary-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">SUPPLY<em>GRID</em></div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="nav-btn" onclick="window.location.href='index.html'">Search</button>
    <div id="navAuth"></div>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="ai-tag">✨ AI-powered BOM sourcing</div>
    <h1>Source your entire BOM at once</h1>
    <p>Upload a bill of materials and AI matches every line against verified supplier inventory. Set your filters, review coverage, and send RFQs in bulk.</p>
  </div>
</div>

<div class="main" id="main">
  <div class="loading">Loading...</div>
</div>

<script>
  const { createClient } = supabase
  const SUPABASE_URL = 'https://zcqfwkbgrevaixqjytzc.supabase.co'
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds'
  const client = createClient(SUPABASE_URL, ANON_KEY)
  let currentUser = null, parsedItems = [], coverageData = null, lastUsage = null

  async function init() {
    const { data: { session } } = await client.auth.getSession()
    if (!session) {
      document.getElementById('navAuth').innerHTML = '<button class="nav-btn" onclick="window.location.href=\'signup.html\'">Sign in</button>'
      document.getElementById('main').innerHTML = '<div class="gate-card"><div class="gate-inner"><h2>Sign in to use BOM sourcing</h2><p>BOM sourcing is free with your account during the founding phase, with a monthly allowance. Sign in to continue.</p><button class="gate-btn" onclick="window.location.href=\'signup.html\'">Sign in →</button></div></div>'
      return
    }
    currentUser = session.user
    document.getElementById('navAuth').innerHTML = '<button class="nav-btn" onclick="window.location.href=\'dashboard.html\'">Dashboard</button>'

    renderUpload()
  }

  function renderCapReached(usage) {
    document.getElementById('main').innerHTML =
      '<div class="gate-card"><div class="gate-inner">' +
      '<h2>You have used all ' + (usage?.limit || 5) + ' free BOM analyses this month</h2>' +
      '<p>Your free allowance resets at the start of next month. Paid plans with unlimited BOM sourcing launch after the founding period, and founding suppliers keep a permanent discount.</p>' +
      '<button class="gate-btn" onclick="window.location.href=\'index.html\'">Back to search</button>' +
      '</div></div>'
  }

  function renderGate() {
    document.getElementById('main').innerHTML =
      '<div class="gate-card"><div class="gate-inner">' +
      '<h2>BOM sourcing is an Intelligence feature</h2>' +
      '<p>Upload an entire bill of materials and source every line at once. This feature is part of the Intelligence membership.</p>' +
      '<div class="gate-features">' +
        '<div class="gate-feature"><span>✓</span> Upload CSV or Excel BOMs of any size</div>' +
        '<div class="gate-feature"><span>✓</span> AI parses messy spreadsheets automatically</div>' +
        '<div class="gate-feature"><span>✓</span> Match every line against verified inventory</div>' +
        '<div class="gate-feature"><span>✓</span> Send RFQs to all suppliers in one action</div>' +
      '</div>' +
      '<button class="gate-btn" onclick="window.location.href=\'signup.html\'">Create a free account →</button>' +
      '</div></div>'
  }

  function renderUpload() {
    document.getElementById('main').innerHTML =
      '<div class="step"><div class="step-num">Step 1</div>' +
      '<div class="step-title">Upload your BOM</div>' +
      '<div class="step-sub">CSV or Excel. Messy formats are fine, AI will read the columns and pull out part numbers, manufacturers, and quantities.</div>' +
      '<div class="drop-zone" id="dropZone" onclick="document.getElementById(\'fileInput\').click()">' +
        '<div class="drop-icon">📄</div>' +
        '<div class="drop-title">Drop your BOM here or click to browse</div>' +
        '<div class="drop-sub">Supports .csv, .xlsx, and .xls files</div>' +
        '<button class="drop-btn">Choose file</button>' +
        '<div class="file-name" id="fileName"></div>' +
      '</div>' +
      '<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none" />' +
      '<div class="status-msg" id="uploadStatus"></div>' +
      '</div>'

    const fileInput = document.getElementById('fileInput')
    const dropZone = document.getElementById('dropZone')
    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]) })
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover') })
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'))
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('dragover')
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0])
    })
  }

  async function handleFile(file) {
    document.getElementById('fileName').textContent = 'Reading ' + file.name + '...'
    try {
      const rows = await readFileToRows(file)
      if (!rows || !rows.trim()) { showUploadError('Could not read any data from that file.'); return }
      document.getElementById('fileName').textContent = file.name
      await parseRows(rows)
    } catch (e) {
      showUploadError('Could not read that file. Make sure it is a valid CSV or Excel file.')
    }
  }

  function readFileToRows(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader()
      reader.onload = e => {
        try {
          const data = new Uint8Array(e.target.result)
          const wb = XLSX.read(data, { type: 'array' })
          const sheet = wb.Sheets[wb.SheetNames[0]]
          const csv = XLSX.utils.sheet_to_csv(sheet)
          // Limit to first 200 rows to keep parsing bounded
          const limited = csv.split('\n').slice(0, 200).join('\n')
          resolve(limited)
        } catch (err) { reject(err) }
      }
      reader.onerror = reject
      reader.readAsArrayBuffer(file)
    })
  }

  function showUploadError(msg) {
    const s = document.getElementById('uploadStatus')
    if (s) { s.className = 'status-msg error'; s.textContent = msg }
  }

  async function parseRows(rows) {
    document.getElementById('main').innerHTML = '<div class="loading">✨ AI is reading your BOM and extracting line items...</div>'
    const { data: { session } } = await client.auth.getSession()
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/bom-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
        body: JSON.stringify({ action: 'parse', rows })
      })
      const data = await res.json()
      if (data.limit_reached) { renderCapReached(data.usage); return }
      if (!data.success || !data.items || !data.items.length) {
        document.getElementById('main').innerHTML = '<div class="step"><div class="step-title">No line items found</div><div class="step-sub">AI could not find recognizable part numbers in that file. Check the file and try again.</div><button class="btn-ghost" onclick="renderUpload()">← Try another file</button></div>'
        return
      }
      parsedItems = data.items
      lastUsage = data.usage || null
      renderConfirm()
    } catch (e) {
      document.getElementById('main').innerHTML = '<div class="step"><div class="step-title">Parsing failed</div><div class="step-sub">Please try again.</div><button class="btn-ghost" onclick="renderUpload()">← Try again</button></div>'
    }
  }

  function renderConfirm() {
    let rows = parsedItems.map((it, i) =>
      '<tr>' +
      '<td><input value="' + (it.part_number || '') + '" onchange="updateItem(' + i + ',\'part_number\',this.value)" /></td>' +
      '<td><input value="' + (it.manufacturer || '') + '" onchange="updateItem(' + i + ',\'manufacturer\',this.value)" /></td>' +
      '<td><input value="' + (it.quantity || '') + '" onchange="updateItem(' + i + ',\'quantity\',this.value)" style="max-width:90px" /></td>' +
      '<td style="text-align:center"><button class="row-remove" onclick="removeRow(' + i + ')">×</button></td>' +
      '</tr>').join('')

    document.getElementById('main').innerHTML =
      '<div class="step"><div class="step-num">Step 2 · Confirm</div>' +
      '<div class="step-title">Review the parsed line items</div>' +
      '<div class="step-sub">AI extracted ' + parsedItems.length + ' line items. Correct anything that looks wrong before matching.' + (lastUsage && !lastUsage.paid ? ' You have used ' + lastUsage.used + ' of ' + lastUsage.limit + ' free BOM analyses this month.' : '') + '</div>' +
      '<div class="table-wrap"><table class="confirm-table"><thead><tr><th>Part number</th><th>Manufacturer</th><th>Qty</th><th></th></tr></thead><tbody id="confirmBody">' + rows + '</tbody></table></div>' +
      '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn-primary" onclick="renderFilters()">Continue to filters →</button><button class="btn-ghost" onclick="renderUpload()">← Upload different file</button></div>' +
      '</div>'
  }

  function updateItem(i, field, val) { parsedItems[i][field] = val }
  function removeRow(i) { parsedItems.splice(i, 1); if (!parsedItems.length) { renderUpload(); return } renderConfirm() }

  function renderFilters() {
    document.getElementById('main').innerHTML =
      '<div class="step"><div class="step-num">Step 3 · Filters</div>' +
      '<div class="step-title">Set your sourcing criteria</div>' +
      '<div class="step-sub">Only listings that meet these filters will be matched against your BOM.</div>' +
      '<div class="filters-grid">' +
        '<div class="filter-field"><label>Source region</label><select id="fRegion"><option value="all">Any region</option><option value="Americas">Americas</option><option value="Europe">Europe</option><option value="Asia">Asia</option></select></div>' +
        '<div class="filter-field"><label>Minimum supplier tier</label><select id="fTier"><option value="0">Any supplier</option><option value="2">Verified Business or higher</option><option value="3">Certified Supplier only</option></select></div>' +
      '</div>' +
      '<div class="toggle-row"><div class="toggle" id="fStocked" onclick="this.classList.toggle(\'on\')"><div class="toggle-knob"></div></div><div><div class="toggle-label">Stocked inventory only</div><div class="toggle-sub">Exclude brokered listings, only match parts physically in stock</div></div></div>' +
      '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn-primary" onclick="runMatch()">Match my BOM →</button><button class="btn-ghost" onclick="renderConfirm()">← Back</button></div>' +
      '</div>'
  }

  async function runMatch() {
    const filters = {
      region: document.getElementById('fRegion').value,
      min_tier: parseInt(document.getElementById('fTier').value),
      stocked_only: document.getElementById('fStocked').classList.contains('on')
    }
    document.getElementById('main').innerHTML = '<div class="loading">Matching ' + parsedItems.length + ' line items against supplier inventory...</div>'
    const { data: { session } } = await client.auth.getSession()
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/bom-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
        body: JSON.stringify({ action: 'match', items: parsedItems, filters })
      })
      const data = await res.json()
      if (!data.success) { document.getElementById('main').innerHTML = '<div class="step"><div class="step-title">Match failed</div><button class="btn-ghost" onclick="renderFilters()">← Back</button></div>'; return }
      coverageData = data
      renderCoverage(data)
    } catch (e) {
      document.getElementById('main').innerHTML = '<div class="step"><div class="step-title">Match failed</div><button class="btn-ghost" onclick="renderFilters()">← Back</button></div>'
    }
  }

  function renderCoverage(data) {
    const s = data.summary
    let html = '<div class="step"><div class="step-num">Step 4 · Coverage</div>' +
      '<div class="step-title">Sourcing coverage report</div>' +
      '<div class="step-sub">Select a supplier for each covered line, then send RFQs in bulk. Uncovered lines become want-to-buy alerts so you are notified when supply appears.</div>' +
      '<div class="summary-row">' +
        '<div class="summary-card total"><div class="summary-num">' + s.total + '</div><div class="summary-label">Total lines</div></div>' +
        '<div class="summary-card covered"><div class="summary-num">' + s.covered + '</div><div class="summary-label">Have supply</div></div>' +
        '<div class="summary-card gaps"><div class="summary-num">' + s.gaps + '</div><div class="summary-label">No supply</div></div>' +
      '</div>'

    html += data.coverage.map((line, li) => {
      if (line.covered) {
        const opts = line.matches.map((m, mi) =>
          '<label class="match-option">' +
          '<input type="radio" name="line-' + li + '" value="' + mi + '"' + (mi === 0 ? ' checked' : '') + ' />' +
          '<div style="flex:1"><div class="match-supplier">' + m.supplier_name +
            (m.verification_tier === 3 ? ' <span class="match-badge c">★ Certified</span>' : m.verification_tier === 2 ? ' <span class="match-badge v">🛡 Verified</span>' : '') +
          '</div><div class="match-meta">' + (m.region || '—') + ' · ' + m.inventory_type + (m.quantity ? ' · ' + m.quantity.toLocaleString() + ' units' : '') + '</div></div>' +
          '</label>').join('')
        return '<div class="coverage-line"><div class="coverage-head"><div><span class="coverage-pn">' + line.part_number + '</span> <span class="coverage-qty">' + (line.quantity ? 'need ' + line.quantity : '') + '</span></div><span class="coverage-status ok">' + line.matches.length + ' supplier' + (line.matches.length !== 1 ? 's' : '') + '</span></div>' + opts + '</div>'
      } else {
        return '<div class="coverage-line gap"><div class="coverage-head"><div><span class="coverage-pn">' + line.part_number + '</span> <span class="coverage-qty">' + (line.quantity ? 'need ' + line.quantity : '') + '</span></div><span class="coverage-status no">No supply</span></div><div class="gap-note">Will be added as a want-to-buy alert. You will be notified when a supplier lists this part.</div></div>'
      }
    }).join('')

    html += '<div style="display:flex;gap:10px;margin-top:20px"><button class="btn-primary" id="sendBtn" onclick="sendBulk()">Add selected to RFQ cart' + (s.gaps > 0 ? ' and create ' + s.gaps + ' alerts' : '') + ' →</button><button class="btn-ghost" onclick="renderFilters()">← Adjust filters</button></div>'
    html += '<div class="status-msg" id="bulkStatus"></div></div>'
    document.getElementById('main').innerHTML = html
  }

  async function sendBulk() {
    const btn = document.getElementById('sendBtn')
    const status = document.getElementById('bulkStatus')
    btn.disabled = true
    status.className = 'status-msg success'; status.textContent = 'Adding to cart...'

    let cartCount = 0, alertCount = 0
    const gapParts = []

    for (let li = 0; li < coverageData.coverage.length; li++) {
      const line = coverageData.coverage[li]
      if (line.covered) {
        const selected = document.querySelector('input[name="line-' + li + '"]:checked')
        if (selected) {
          const m = line.matches[parseInt(selected.value)]
          try {
            const { data: existing } = await client.from('rfq_carts').select('id').eq('buyer_id', currentUser.id).eq('part_number', line.part_number).eq('supplier_id', m.supplier_id).maybeSingle()
            if (!existing) {
              await client.from('rfq_carts').insert({
                buyer_id: currentUser.id, part_number: line.part_number, supplier_id: m.supplier_id,
                supplier_name: m.anonymous ? 'Anonymous Seller' : m.supplier_name,
                manufacturer: line.manufacturer || null, part_description: ''
              })
              cartCount++
            }
          } catch (e) { /* skip */ }
        }
      } else {
        gapParts.push(line)
      }
    }

    // Roll uncovered lines into want-to-buy alerts
    for (const gap of gapParts) {
      try {
        await client.from('want_to_buy').insert({
          buyer_email: currentUser.email, part_number: gap.part_number,
          quantity_needed: gap.quantity ? parseInt(gap.quantity) : null, fulfilled: false
        })
        alertCount++
      } catch (e) { /* skip */ }
    }

    status.className = 'status-msg success'
    status.textContent = cartCount + ' item' + (cartCount !== 1 ? 's' : '') + ' added to your RFQ cart' + (alertCount > 0 ? ', ' + alertCount + ' want-to-buy alert' + (alertCount !== 1 ? 's' : '') + ' created' : '') + '. Redirecting to cart...'
    setTimeout(() => window.location.href = 'rfq-cart.html', 2000)
  }

  init()
</script>
</body>
</html>
