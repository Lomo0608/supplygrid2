<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: rgba(10,22,40,0.9); backdrop-filter: blur(12px); border-bottom: 0.5px solid #1a3560; height: 68px; display: flex; align-items: center; padding: 0 40px; }
    .nav-logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; cursor: pointer; }
    .nav-logo em { font-style: normal; color: #3b82f6; }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .card-title { font-size: 18px; font-weight: 500; color: #111; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #7ba3c8; margin-bottom: 22px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: #7ba3c8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    .field input { width: 100%; background: #fff; border: 0.5px solid #e0e0e0; border-radius: 6px; padding: 10px 12px; color: #111; font-size: 13px; font-family: inherit; }
    .field input:focus { outline: none; border-color: #3b82f6; }
    .submit-btn { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 11px 0; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 6px; }
    .submit-btn:hover { background: #2563eb; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-top: 12px; display: none; }
    .status.success { display: block; background: #f0fdf4; color: #166534; border: 0.5px solid #bbf7d0; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }
    .back { font-size: 12px; color: #aaa; text-align: center; margin-top: 16px; cursor: pointer; }
    .back:hover { color: #111; }
    #loading { font-size: 13px; color: #7ba3c8; text-align: center; padding: 20px 0; }
    #formArea { display: none; }
  </style>
</head>
<body>
<nav><div class="nav-logo" onclick="window.location.href='index.html'">SUPPLY<em>GRID</em></div></nav>
<div class="page">
  <div class="card">
    <div id="loading">Verifying reset link...</div>
    <div id="formArea">
      <div class="card-title">Set new password</div>
      <div class="card-sub">Enter and confirm your new password below.</div>
      <div class="field"><label>New password</label><input type="password" id="password" placeholder="Min 8 characters" /></div>
      <div class="field"><label>Confirm password</label><input type="password" id="confirmPassword" placeholder="Repeat password" /></div>
      <button class="submit-btn" id="submitBtn" onclick="doReset()">Update password →</button>
      <div class="status" id="status"></div>
    </div>
    <div class="back" onclick="window.location.href='signup.html'">← Back to sign in</div>
  </div>
</div>
<script>
  const { createClient } = supabase
  const client = createClient('https://zcqfwkbgrevaixqjytzc.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds')
  client.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && window.location.hash.includes('type=recovery'))) {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('formArea').style.display = 'block'
    }
  })
  async function checkSession() {
    const { data: { session } } = await client.auth.getSession()
    if (session) { document.getElementById('loading').style.display = 'none'; document.getElementById('formArea').style.display = 'block' }
    else if (!window.location.hash.includes('access_token')) document.getElementById('loading').textContent = 'Invalid or expired reset link.'
  }
  checkSession()
  async function doReset() {
    const password = document.getElementById('password').value
    const confirm = document.getElementById('confirmPassword').value
    const status = document.getElementById('status')
    const btn = document.getElementById('submitBtn')
    if (!password || password.length < 8) { status.className = 'status error'; status.textContent = 'Password must be at least 8 characters.'; return }
    if (password !== confirm) { status.className = 'status error'; status.textContent = 'Passwords do not match.'; return }
    btn.disabled = true
    const { error } = await client.auth.updateUser({ password })
    if (error) { status.className = 'status error'; status.textContent = error.message; btn.disabled = false; return }
    status.className = 'status success'; status.textContent = 'Password updated. Redirecting...'
    setTimeout(() => window.location.href = 'dashboard.html', 1500)
  }
</script>
</body>
</html>
