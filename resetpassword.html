<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e8e8e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
    .card { width: 100%; max-width: 400px; background: #0e0e0e; border: 0.5px solid #1e1e1e; border-radius: 12px; padding: 32px; }
    .logo { font-size: 15px; font-weight: 500; color: #fff; text-align: center; margin-bottom: 24px; }
    .logo span { color: #22c55e; }
    .title { font-size: 16px; font-weight: 500; color: #e8e8e8; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    .field input { width: 100%; background: #141414; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 10px 12px; color: #e8e8e8; font-size: 13px; font-family: inherit; }
    .field input:focus { outline: none; border-color: #22c55e; }
    .submit-btn { width: 100%; background: #22c55e; color: #000; border: none; border-radius: 8px; padding: 11px 0; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
    .submit-btn:hover { background: #16a34a; }
    .status { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-top: 12px; display: none; }
    .status.success { display: block; background: #0d1f0d; color: #22c55e; border: 0.5px solid #166534; }
    .status.error { display: block; background: #1f0d0d; color: #f87171; border: 0.5px solid #991b1b; }
    .back { font-size: 12px; color: #555; text-align: center; margin-top: 16px; cursor: pointer; }
    .back:hover { color: #e8e8e8; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Supply<span>Grid</span></div>
  <div class="title">Set new password</div>
  <div class="sub">Enter your new password below.</div>
  <div class="field">
    <label>New password</label>
    <input type="password" id="password" placeholder="Min 8 characters" />
  </div>
  <div class="field">
    <label>Confirm password</label>
    <input type="password" id="confirmPassword" placeholder="Repeat password" />
  </div>
  <button class="submit-btn" onclick="doReset()">Update password →</button>
  <div class="status" id="status"></div>
  <div class="back" onclick="window.location.href='signup.html'">← Back to sign in</div>
</div>
<script>
  const { createClient } = supabase
  const client = createClient(
    'https://zcqfwkbgrevaixqjytzc.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds'
  )

  async function doReset() {
    const password = document.getElementById('password').value
    const confirm = document.getElementById('confirmPassword').value
    const status = document.getElementById('status')

    if (!password || password.length < 8) {
      status.className = 'status error'
      status.textContent = 'Password must be at least 8 characters.'
      return
    }
    if (password !== confirm) {
      status.className = 'status error'
      status.textContent = 'Passwords do not match.'
      return
    }

    const { error } = await client.auth.updateUser({ password })
    if (error) {
      status.className = 'status error'
      status.textContent = error.message
      return
    }
    status.className = 'status success'
    status.textContent = 'Password updated. Redirecting...'
    setTimeout(() => window.location.href = 'dashboard.html', 1500)
  }
</script>
</body>
</html>
