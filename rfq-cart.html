<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — RFQ Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0a1628; --blue: #3b82f6; --blue-hover: #2563eb; --text-muted: #7ba3c8; --text-faint: #4a7aa8; --border-dark: #1a3560; --bg: #f5f7fa; --card-border: #e6ebf2; --ink: #0a1628; --ink-2: #475569; --ink-3: #94a3b8; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    nav { background: rgba(10,22,40,0.95); backdrop-filter: blur(12px); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid var(--border-dark); }
    .nav-logo { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; cursor: pointer; }
    .nav-logo em { font-style: normal; color: var(--blue); }
    .nav-btn { font-size: 13px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-dark); background: transparent; color: #e2e8f0; cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.13s; }
    .nav-btn:hover { border-color: var(--blue); color: #fff; }
    .main { max-width: 860px; margin: 0 auto; padding: 30px 24px 70px; }
    .page-header { margin-bottom: 22px; }
    .page-title { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.6px; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: var(--ink-3); }
    .buyer-card { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(10,22,40,0.04); margin-bottom: 16px; }
    .card-title { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label { display: block; font-size: 11px; color: var(--ink-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
    .field input { width: 100%; background: #fff; border: 1px solid #d8e0ea; border-radius: 9px; padding: 10px 13px; color: var(--ink); font-size: 14px; font-family: inherit; transition: border-color 0.13s, box-shadow 0.13s; }
    .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .supplier-block { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; box-shadow: 0 1px 2px rgba(10,22,40,0.04); margin-bottom: 14px; overflow: hidden; }
    .supplier-head { padding: 13px 20px; background: #fafbfd; border-bottom: 1px solid #eef2f7; display: flex; align-items: center; justify-content: space-between; }
    .supplier-head-name { font-size: 14px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; letter-spacing: -0.2px; }
    .anon-tag { font-size: 9px; padding: 3px 8px; border-radius: 4px; background: #f1f5f9; color: var(--ink-2); font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
    .supplier-part-count { font-size: 12px; color: var(--ink-3); }
    .part-row { padding: 12px 20px; border-bottom: 1px solid #f3f6fa; display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 32px; gap: 12px; align-items: center; }
    .part-row:last-child { border-bottom: none; }
    .part-row:hover { background: #fafcff; }
    .part-row-pn { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; font-weight: 600; color: var(--ink); }
    .part-row-mfr { font-size: 12px; color: var(--ink-2); }
    .part-row-desc { font-size: 11px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .part-row input { width: 100%; background: #fff; border: 1px solid #d8e0ea; border-radius: 7px; padding: 8px 10px; color: var(--ink); font-size: 12.5px; font-family: inherit; transition: border-color 0.13s, box-shadow 0.13s; }
    .part-row input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .remove-btn { background: none; border: none; cursor: pointer; color: #cbd5e1; font-size: 18px; padding: 0; line-height: 1; transition: color 0.12s; }
    .remove-btn:hover { color: #dc2626; }
    .part-row-header { padding: 9px 20px; background: #f8fafc; border-bottom: 1px solid #eef2f7; display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 32px; gap: 12px; }
    .part-row-header span { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; }
    .global-notes { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; padding: 20px 24px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(10,22,40,0.04); }
    .global-notes textarea { width: 100%; background: #fff; border: 1px solid #d8e0ea; border-radius: 9px; padding: 10px 13px; color: var(--ink); font-size: 13.5px; font-family: inherit; resize: vertical; min-height: 80px; margin-top: 8px; transition: border-color 0.13s, box-shadow 0.13s; }
    .global-notes textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .send-all-btn { width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 11px; padding: 14px 0; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 10px; transition: all 0.13s; }
    .send-all-btn:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .send-all-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-sub { font-size: 12px; color: var(--ink-3); text-align: center; }
    .status { font-size: 13px; padding: 11px 14px; border-radius: 8px; margin-top: 12px; display: none; }
    .status.success { display: block; background: #f0fdf4; color: #166534; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }
    .status.loading { display: block; background: #eff6ff; color: #1d4ed8; }
    .empty-cart { text-align: center; padding: 70px 40px; background: #fff; border: 1px solid var(--card-border); border-radius: 16px; box-shadow: 0 1px 2px rgba(10,22,40,0.04); }
    .empty-cart h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--ink); letter-spacing: -0.3px; }
    .empty-cart p { font-size: 13.5px; color: var(--ink-3); margin-bottom: 20px; }
    .empty-cart button { background: var(--blue); color: #fff; border: none; border-radius: 9px; padding: 12px 26px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .empty-cart button:hover { background: var(--blue-hover); }
    .progress-bar { background: #edf1f7; border-radius: 4px; height: 5px; margin-top: 12px; overflow: hidden; display: none; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width 0.3s; }
    @media (max-width: 700px) {
      .main { padding: 20px 14px 60px; }
      .part-row, .part-row-header { grid-template-columns: 1.6fr 1fr 0.8fr 0.8fr 28px; gap: 8px; padding: 10px 14px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">SUPPLY<em>GRID</em></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="navEmail" style="font-size:12px;color:#999"></span>
    <button class="nav-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-title">Review and send RFQs</div>
    <div class="page-sub">Each supplier receives one email containing only their relevant parts. Your information is pre-filled from your profile.</div>
  </div>

  <div id="cartContent"></div>
</div>

<script>
  const { createClient } = supabase
  const SUPABASE_URL = 'https://zcqfwkbgrevaixqjytzc.supabase.co'
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds'
  const client = createClient(SUPABASE_URL, ANON_KEY)

  let currentUser = null
  let cartItems = []
  let buyerProfile = {}

  async function init() {
    const { data: { session } } = await client.auth.getSession()
    if (!session) { window.location.href = 'signup.html'; return }
    currentUser = session.user
    document.getElementById('navEmail').textContent = session.user.email
    await Promise.all([loadProfile(), loadCart()])
  }

  async function loadProfile() {
    const { data } = await client.from('profiles').select('*').eq('user_id', currentUser.id).maybeSingle()
    if (data) buyerProfile = data
  }

  async function loadCart() {
    const { data: items } = await client
      .from('rfq_carts')
      .select('*, suppliers(id, company_name, anonymous_seller, verification_tier, region, country)')
      .eq('buyer_id', currentUser.id)
      .order('created_at', { ascending: true })

    cartItems = items || []
    renderCart()
  }

  function renderCart() {
    const container = document.getElementById('cartContent')
    if (!cartItems.length) {
      container.innerHTML = `
        <div class="empty-cart">
          <h2>Your RFQ cart is empty</h2>
          <p>Add suppliers to your cart from the search results page.</p>
          <button onclick="window.location.href='index.html'">Search parts →</button>
        </div>`
      return
    }

    // Group by supplier
    const bySupplier = {}
    cartItems.forEach(item => {
      const sid = item.supplier_id
      if (!bySupplier[sid]) bySupplier[sid] = { supplier: item.suppliers, items: [] }
      bySupplier[sid].items.push(item)
    })

    const supplierCount = Object.keys(bySupplier).length

    let html = `
      <div class="buyer-card">
        <div class="card-title">Your contact information</div>
        <div class="grid-2">
          <div class="field"><label>Company</label><input type="text" id="buyerCompany" placeholder="Your company" value="${buyerProfile.company_name || ''}" /></div>
          <div class="field"><label>Your name</label><input type="text" id="buyerName" placeholder="First Last" value="${[buyerProfile.first_name, buyerProfile.last_name].filter(Boolean).join(' ')}" /></div>
          <div class="field"><label>Email *</label><input type="email" id="buyerEmail" placeholder="you@company.com" value="${currentUser.email}" /></div>
          <div class="field"><label>Phone</label><input type="text" id="buyerPhone" placeholder="Optional" value="${buyerProfile.phone || ''}" /></div>
        </div>
      </div>

      <div style="font-size:13px;color:#888;margin-bottom:14px">${supplierCount} supplier${supplierCount !== 1 ? 's' : ''} · ${cartItems.length} line item${cartItems.length !== 1 ? 's' : ''}</div>
    `

    Object.values(bySupplier).forEach(({ supplier, items }) => {
      const isAnon = supplier?.anonymous_seller
      const name = isAnon ? 'Anonymous Supplier' : (supplier?.company_name || 'Unknown Supplier')
      html += `
        <div class="supplier-block">
          <div class="supplier-head">
            <div class="supplier-head-name">
              ${name}
              ${isAnon ? '<span class="anon-tag">🔒 Anonymous · Identity protected</span>' : ''}
              ${!isAnon && supplier?.verification_tier === 3 ? '<span class="anon-tag" style="background:#f0fdf4;color:#166534;border-color:#bbf7d0">★ Certified</span>' : ''}
              ${!isAnon && supplier?.verification_tier === 2 ? '<span class="anon-tag" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe">🛡 Verified</span>' : ''}
            </div>
            <div class="supplier-part-count">${items.length} part${items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="part-row-header">
            <span>Part number</span>
            <span>Description</span>
            <span>Qty needed</span>
            <span>Target price (USD)</span>
            <span></span>
          </div>
          ${items.map(item => `
            <div class="part-row" id="row-${item.id}">
              <div>
                <div class="part-row-pn">${item.part_number}</div>
                <div class="part-row-mfr">${item.manufacturer || '—'}</div>
              </div>
              <div class="part-row-desc">${item.part_description || '—'}</div>
              <input type="number" id="qty-${item.id}" placeholder="Qty" min="1" />
              <input type="number" id="price-${item.id}" placeholder="per unit" step="0.01" />
              <button class="remove-btn" onclick="removeItem('${item.id}')">×</button>
            </div>
          `).join('')}
          <div style="padding:12px 20px;border-top:0.5px solid #f0f0f0">
            <label style="font-size:11px;color:#888;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px">Message to ${name}</label>
            <textarea id="notes-${supplier?.id}" placeholder="Date code requirements, certifications, delivery timeline, anything specific to this supplier..." style="width:100%;background:#f8fafc;border:0.5px solid #e0e0e0;border-radius:5px;padding:9px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:60px;color:#111"></textarea>
          </div>
        </div>
      `
    })

    html += `
      <div class="global-notes">
        <div class="card-title">Message to all suppliers</div>
        <textarea id="globalNotes" placeholder="Applicable to all suppliers — date code requirements, delivery timeline, certifications needed, special instructions..."></textarea>
      </div>
      <button class="send-all-btn" id="sendBtn" onclick="sendAllRFQs()">Send RFQs to ${supplierCount} supplier${supplierCount !== 1 ? 's' : ''} →</button>
      <div class="send-sub">Each supplier receives one email showing only their parts. Anonymous suppliers are handled through SupplyGrid.</div>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="status" id="sendStatus"></div>
    `

    container.innerHTML = html
  }

  async function removeItem(id) {
    await client.from('rfq_carts').delete().eq('id', id)
    cartItems = cartItems.filter(i => i.id !== id)
    renderCart()
  }

  async function sendAllRFQs() {
    const email = document.getElementById('buyerEmail').value.trim()
    const company = document.getElementById('buyerCompany').value.trim()
    const name = document.getElementById('buyerName').value.trim()
    const phone = document.getElementById('buyerPhone').value.trim()
    const status = document.getElementById('sendStatus')
    const btn = document.getElementById('sendBtn')
    const progress = document.getElementById('progressBar')
    const fill = document.getElementById('progressFill')

    if (!email) { status.className = 'status error'; status.textContent = 'Please enter your email address.'; return }

    // Save profile if changed
    await client.from('profiles').upsert({
      user_id: currentUser.id,
      company_name: company,
      first_name: name.split(' ')[0] || '',
      last_name: name.split(' ').slice(1).join(' ') || '',
      phone,
      profile_complete: true
    }, { onConflict: 'user_id' })

    // Get session token for Edge Function auth
    const { data: { session } } = await client.auth.getSession()
    const authToken = session?.access_token || ANON_KEY

    btn.disabled = true
    progress.style.display = 'block'
    status.className = 'status loading'
    status.textContent = 'Sending RFQs...'

    const bySupplier = {}
    cartItems.forEach(item => {
      const sid = item.supplier_id
      if (!bySupplier[sid]) bySupplier[sid] = { supplier: item.suppliers, parts: [] }
      bySupplier[sid].parts.push({
        part_number: item.part_number,
        manufacturer: item.manufacturer,
        description: item.part_description,
        quantity_needed: parseInt(document.getElementById('qty-' + item.id)?.value) || null,
        target_price: parseFloat(document.getElementById('price-' + item.id)?.value) || null
      })
    })

    const suppliers = Object.values(bySupplier)
    let sent = 0, failed = 0

    for (let i = 0; i < suppliers.length; i++) {
      const { supplier, parts } = suppliers[i]
      // Per-supplier notes field
      const supplierNotes = document.getElementById('notes-' + supplier?.id)?.value || ''

      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/send-rfq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify({
            supplier_id: supplier.id,
            buyer_email: email,
            buyer_company: company,
            buyer_name: name,
            buyer_phone: phone,
            parts,
            notes: supplierNotes,
            is_cart_rfq: true
          })
        })
        if (res.ok) sent++
        else failed++
      } catch(e) { failed++ }
      fill.style.width = ((i + 1) / suppliers.length * 100) + '%'
    }

    // Clear cart
    await client.from('rfq_carts').delete().eq('buyer_id', currentUser.id)

    if (sent > 0) {
      status.className = 'status success'
      status.textContent = sent + ' RFQ' + (sent !== 1 ? 's' : '') + ' sent.' + (failed > 0 ? ' ' + failed + ' failed.' : '') + ' Check your email for confirmation.'
      setTimeout(() => window.location.href = 'index.html', 3000)
    } else {
      status.className = 'status error'
      status.textContent = 'Send failed. The RFQ email service may not be fully configured yet. Your cart has been preserved.'
      btn.disabled = false
    }
  }

  init()
</script>
</body>
</html>
