<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGrid — RFQ Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
    nav { background: #0a1628; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; }
    .nav-logo { font-size: 20px; font-weight: 600; color: #fff; letter-spacing: 1px; cursor: pointer; }
    .nav-logo em { font-style: normal; color: #3b82f6; }
    .nav-btn { font-size: 12px; padding: 7px 18px; border-radius: 4px; border: 0.5px solid #333; background: transparent; color: #e8e8e8; cursor: pointer; font-family: inherit; }
    .main { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 500; color: #111; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: #7ba3c8; }
    .buyer-card { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; }
    .card-title { font-size: 13px; font-weight: 600; color: #111; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label { display: block; font-size: 11px; color: #7ba3c8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    .field input { width: 100%; background: #fff; border: 0.5px solid #e0e0e0; border-radius: 5px; padding: 9px 12px; color: #111; font-size: 13px; font-family: inherit; }
    .field input:focus { outline: none; border-color: #3b82f6; }
    .supplier-block { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
    .supplier-head { padding: 14px 20px; background: #fafafa; border-bottom: 0.5px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; }
    .supplier-head-name { font-size: 14px; font-weight: 600; color: #111; display: flex; align-items: center; gap: 8px; }
    .anon-tag { font-size: 10px; padding: 2px 7px; border-radius: 3px; background: #f5f5f5; color: #7ba3c8; border: 0.5px solid #e0e0e0; }
    .supplier-part-count { font-size: 12px; color: #7ba3c8; }
    .part-row { padding: 12px 20px; border-bottom: 0.5px solid #f0f0f0; display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 32px; gap: 12px; align-items: center; }
    .part-row:last-child { border-bottom: none; }
    .part-row-pn { font-family: monospace; font-size: 13px; font-weight: 500; color: #111; }
    .part-row-mfr { font-size: 12px; color: #7ba3c8; }
    .part-row-desc { font-size: 11px; color: #aaa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .part-row input { width: 100%; background: #f5f5f5; border: 0.5px solid #e0e0e0; border-radius: 4px; padding: 7px 9px; color: #111; font-size: 12px; font-family: inherit; }
    .part-row input:focus { outline: none; border-color: #3b82f6; background: #fff; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #ddd; font-size: 18px; padding: 0; line-height: 1; }
    .remove-btn:hover { color: #dc2626; }
    .part-row-header { padding: 8px 20px; background: #f9f9f9; border-bottom: 0.5px solid #f0f0f0; display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 32px; gap: 12px; }
    .part-row-header span { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.3px; }
    .global-notes { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; }
    .global-notes textarea { width: 100%; background: #f5f5f5; border: 0.5px solid #e0e0e0; border-radius: 5px; padding: 10px 12px; color: #111; font-size: 13px; font-family: inherit; resize: vertical; min-height: 80px; margin-top: 8px; }
    .global-notes textarea:focus { outline: none; border-color: #3b82f6; background: #fff; }
    .send-all-btn { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 14px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
    .send-all-btn:hover { background: #2563eb; }
    .send-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-sub { font-size: 12px; color: #aaa; text-align: center; }
    .status { font-size: 13px; padding: 12px 14px; border-radius: 8px; margin-top: 12px; display: none; }
    .status.success { display: block; background: #f0fdf4; color: #166534; border: 0.5px solid #bbf7d0; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }
    .status.loading { display: block; background: #eff6ff; color: #1d4ed8; border: 0.5px solid #bfdbfe; }
    .empty-cart { text-align: center; padding: 80px 40px; background: #fff; border: 0.5px solid #e8e8e8; border-radius: 12px; }
    .empty-cart h2 { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
    .empty-cart p { font-size: 13px; color: #7ba3c8; margin-bottom: 20px; }
    .empty-cart button { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 10px 24px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .progress-bar { background: #f0f0f0; border-radius: 4px; height: 4px; margin-top: 12px; overflow: hidden; display: none; }
    .progress-fill { height: 100%; background: #3b82f6; border-radius: 4px; transition: width 0.3s; }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">SUPPLY<em>GRID</em></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="navEmail" style="font-size:12px;color:#999"></span>
    <button class="nav-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-title">Review and send RFQs</div>
    <div class="page-sub">Each supplier receives one email containing only their relevant parts. Your information is pre-filled from your profile.</div>
  </div>

  <div id="cartContent"></div>
</div>

<script>
  const { createClient } = supabase
  const SUPABASE_URL = 'https://zcqfwkbgrevaixqjytzc.supabase.co'
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWZ3a2JncmV2YWl4cWp5dHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDkzMDUsImV4cCI6MjA5NTEyNTMwNX0.euaNHnoN0KoG23IRCBcK2x2K-OgB4opFF9dZRsoFAds'
  const client = createClient(SUPABASE_URL, ANON_KEY)

  let currentUser = null
  let cartItems = []
  let buyerProfile = {}

  async function init() {
    const { data: { session } } = await client.auth.getSession()
    if (!session) { window.location.href = 'signup.html'; return }
    currentUser = session.user
    document.getElementById('navEmail').textContent = session.user.email
    await Promise.all([loadProfile(), loadCart()])
  }

  async function loadProfile() {
    const { data } = await client.from('profiles').select('*').eq('id', currentUser.id).maybeSingle()
    if (data) buyerProfile = data
  }

  async function loadCart() {
    const { data: items } = await client
      .from('rfq_carts')
      .select('*, suppliers(id, company_name, email, anonymous_seller, verification_tier, region, country)')
      .eq('buyer_id', currentUser.id)
      .order('created_at', { ascending: true })

    cartItems = items || []
    renderCart()
  }

  function renderCart() {
    const container = document.getElementById('cartContent')
    if (!cartItems.length) {
      container.innerHTML = `
        <div class="empty-cart">
          <h2>Your RFQ cart is empty</h2>
          <p>Add suppliers to your cart from the search results page.</p>
          <button onclick="window.location.href='index.html'">Search parts →</button>
        </div>`
      return
    }

    // Group by supplier
    const bySupplier = {}
    cartItems.forEach(item => {
      const sid = item.supplier_id
      if (!bySupplier[sid]) bySupplier[sid] = { supplier: item.suppliers, items: [] }
      bySupplier[sid].items.push(item)
    })

    const supplierCount = Object.keys(bySupplier).length

    let html = `
      <div class="buyer-card">
        <div class="card-title">Your contact information</div>
        <div class="grid-2">
          <div class="field"><label>Company</label><input type="text" id="buyerCompany" placeholder="Your company" value="${buyerProfile.company_name || ''}" /></div>
          <div class="field"><label>Your name</label><input type="text" id="buyerName" placeholder="First Last" value="${[buyerProfile.first_name, buyerProfile.last_name].filter(Boolean).join(' ')}" /></div>
          <div class="field"><label>Email *</label><input type="email" id="buyerEmail" placeholder="you@company.com" value="${currentUser.email}" /></div>
          <div class="field"><label>Phone</label><input type="text" id="buyerPhone" placeholder="Optional" value="${buyerProfile.phone || ''}" /></div>
        </div>
      </div>

      <div style="font-size:13px;color:#888;margin-bottom:14px">${supplierCount} supplier${supplierCount !== 1 ? 's' : ''} · ${cartItems.length} line item${cartItems.length !== 1 ? 's' : ''}</div>
    `

    Object.values(bySupplier).forEach(({ supplier, items }) => {
      const isAnon = supplier?.anonymous_seller
      const name = isAnon ? 'Anonymous Supplier' : (supplier?.company_name || 'Unknown Supplier')
      html += `
        <div class="supplier-block">
          <div class="supplier-head">
            <div class="supplier-head-name">
              ${name}
              ${isAnon ? '<span class="anon-tag">🔒 Anonymous · Identity protected</span>' : ''}
              ${!isAnon && supplier?.verification_tier === 3 ? '<span class="anon-tag" style="background:#f0fdf4;color:#166534;border-color:#bbf7d0">★ Certified</span>' : ''}
              ${!isAnon && supplier?.verification_tier === 2 ? '<span class="anon-tag" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe">🛡 Verified</span>' : ''}
            </div>
            <div class="supplier-part-count">${items.length} part${items.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="part-row-header">
            <span>Part number</span>
            <span>Description</span>
            <span>Qty needed</span>
            <span>Target price (USD)</span>
            <span></span>
          </div>
          ${items.map(item => `
            <div class="part-row" id="row-${item.id}">
              <div>
                <div class="part-row-pn">${item.part_number}</div>
                <div class="part-row-mfr">${item.manufacturer || '—'}</div>
              </div>
              <div class="part-row-desc">${item.part_description || '—'}</div>
              <input type="number" id="qty-${item.id}" placeholder="Qty" min="1" />
              <input type="number" id="price-${item.id}" placeholder="per unit" step="0.01" />
              <button class="remove-btn" onclick="removeItem('${item.id}')">×</button>
            </div>
          `).join('')}
        </div>
      `
    })

    html += `
      <div class="global-notes">
        <div class="card-title">Message to all suppliers</div>
        <textarea id="globalNotes" placeholder="Applicable to all suppliers — date code requirements, delivery timeline, certifications needed, special instructions..."></textarea>
      </div>
      <button class="send-all-btn" id="sendBtn" onclick="sendAllRFQs()">Send RFQs to ${supplierCount} supplier${supplierCount !== 1 ? 's' : ''} →</button>
      <div class="send-sub">Each supplier receives one email showing only their parts. Anonymous suppliers are handled through SupplyGrid.</div>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="status" id="sendStatus"></div>
    `

    container.innerHTML = html
  }

  async function removeItem(id) {
    await client.from('rfq_carts').delete().eq('id', id)
    cartItems = cartItems.filter(i => i.id !== id)
    renderCart()
  }

  async function sendAllRFQs() {
    const email = document.getElementById('buyerEmail').value.trim()
    const company = document.getElementById('buyerCompany').value.trim()
    const name = document.getElementById('buyerName').value.trim()
    const phone = document.getElementById('buyerPhone').value.trim()
    const notes = document.getElementById('globalNotes').value.trim()
    const status = document.getElementById('sendStatus')
    const btn = document.getElementById('sendBtn')
    const progress = document.getElementById('progressBar')
    const fill = document.getElementById('progressFill')

    if (!email) { status.className = 'status error'; status.textContent = 'Please enter your email address.'; return }

    // Save profile if changed
    await client.from('profiles').upsert({ id: currentUser.id, company_name: company, first_name: name.split(' ')[0] || '', last_name: name.split(' ').slice(1).join(' ') || '', phone })

    btn.disabled = true
    progress.style.display = 'block'
    status.className = 'status loading'
    status.textContent = 'Sending RFQs...'

    const bySupplier = {}
    cartItems.forEach(item => {
      const sid = item.supplier_id
      if (!bySupplier[sid]) bySupplier[sid] = { supplier: item.suppliers, parts: [] }
      bySupplier[sid].parts.push({
        part_number: item.part_number,
        manufacturer: item.manufacturer,
        description: item.part_description,
        quantity_needed: parseInt(document.getElementById(`qty-${item.id}`)?.value) || null,
        target_price: parseFloat(document.getElementById(`price-${item.id}`)?.value) || null
      })
    })

    const suppliers = Object.values(bySupplier)
    let sent = 0, failed = 0

    for (let i = 0; i < suppliers.length; i++) {
      const { supplier, parts } = suppliers[i]
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/send-rfq`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ANON_KEY}` },
          body: JSON.stringify({
            supplier_id: supplier.id,
            buyer_email: email,
            buyer_company: company,
            buyer_name: name,
            buyer_phone: phone,
            parts,
            notes,
            is_cart_rfq: true
          })
        })
        const data = await res.json()
        if (data.success) sent++
        else failed++
      } catch(e) { failed++ }
      fill.style.width = `${((i + 1) / suppliers.length) * 100}%`
    }

    // Clear cart
    await client.from('rfq_carts').delete().eq('buyer_id', currentUser.id)

    if (sent > 0) {
      status.className = 'status success'
      status.textContent = `${sent} RFQ${sent !== 1 ? 's' : ''} sent successfully.${failed > 0 ? ` ${failed} failed.` : ''} Check your email for confirmation.`
      setTimeout(() => window.location.href = 'index.html', 3000)
    } else {
      status.className = 'status error'
      status.textContent = 'All sends failed. Please try again or contact support.'
      btn.disabled = false
    }
  }

  init()
</script>
</body>
</html>
